require conf/distro/poky.conf

DISTRO = "clang-sdk"
DISTRO_NAME = "Clang SDK Distro"
DISTRO_VERSION = "1.0"
DISTRO_CODENAME = "clang-sdk"

PACKAGE_CLASSES = "package_deb"
INIT_MANAGER = "systemd"
SDKMACHINE ?= "x86_64"

# Configure LLVM/Clang as the preferred provider
# meta-clang already provides these PROVIDES statements, so we only need
# PREFERRED_PROVIDER. This ensures clang is used instead of the default
# llvm from OE-Core
PREFERRED_PROVIDER_llvm = "clang"
PREFERRED_PROVIDER_llvm-native = "clang-native"
PREFERRED_PROVIDER_nativesdk-llvm = "nativesdk-clang"

TOOLCHAIN = "clang"
CLANGSDK = "1"
TC_CXX_RUNTIME = "llvm"
